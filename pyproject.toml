[project]

name = "pythonproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Player 1", email = "hyouseff227@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.23.0",
    "vosk>=0.3.45",
]

[project.scripts]
pythonproject = "pythonproject:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"