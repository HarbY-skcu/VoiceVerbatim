[project]
name = "project1-beans"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["beans", "fastapi", "httpx", "pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]